name: Daily History Short

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  make-and-upload-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_script.py

      - name: Generate images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python generate_images.py

      - name: Generate parallax layers
        run: python generate_parallax.py

      - name: Fetch B-roll footage
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python fetch_broll.py

      - name: Fetch sound effects
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python fetch_sfx.py

      - name: Generate voiceover
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generate_voiceover.py

      - name: Trim silence
        run: python trim_silence.py

      - name: Generate captions
        run: python generate_captions.py

      - name: Assemble video
        run: python assemble_video.py

      - name: Generate thumbnail
        run: python generate_thumbnail.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload_video.py

      - name: Save topic history back to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add topic_history.json
          git commit -m "Update topic history" || echo "No changes to commit"
          git push
