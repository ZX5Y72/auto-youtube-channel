name: Daily History Short

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: daily-history-short
  cancel-in-progress: false

jobs:
  make-and-upload-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-model-v1

      - name: Generate script
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: python generate_script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Fetch images, B-roll, and sound effects (parallel)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: python fetch_assets_parallel.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

      - name: Generate parallax layers
        timeout-minutes: 10
        run: python generate_parallax.py

      - name: Generate voiceover
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: python generate_voiceover.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Trim silence
        timeout-minutes: 3
        run: python trim_silence.py

      - name: Generate captions
        timeout-minutes: 5
        run: python generate_captions.py

      - name: Assemble video
        timeout-minutes: 15
        run: python assemble_video.py

      - name: Generate thumbnail
        timeout-minutes: 3
        run: python generate_thumbnail.py

      - name: Upload to YouTube
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: python upload_video.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Translate and upload captions
        timeout-minutes: 5
        continue-on-error: true
        run: python translate_captions.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Save history files back to repo
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add topic_history.json hashtag_history.json history_health_log.json 2>/dev/null || true
          git commit -m "Update history files" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ github.run_number }}
          path: output/
          retention-days: 5

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py success

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py failure

      - name: Log run health (success)
        if: success()
        run: python log_run_health.py history success

      - name: Log run health (failure)
        if: failure()
        run: python log_run_health.py history failure
