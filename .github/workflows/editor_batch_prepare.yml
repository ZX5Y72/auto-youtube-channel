name: Editor Batch Prepare

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many new videos to process this run'
        required: false
        default: '10'

jobs:
  batch-prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Batch prepare clips
        timeout-minutes: 300
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: python editor_batch_prepare.py

      - name: Save queue state back to repo
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A -- editor_queue_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Batch prepare: update editor queue state"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-batch-debug-${{ github.run_number }}
          path: output/
          retention-days: 5

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install requests --quiet
          python -c "
          import os, requests
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              requests.post(url, json={'content': '✅ Batch prepare finished. New clips added to the posting queue.'})
          "

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install requests --quiet
          python -c "
          import os, requests
          url = os.environ.get('DISCORD_WEBHOOK_URL')
          if url:
              requests.post(url, json={'content': '❌ Batch prepare failed. Check the Actions tab.'})
          "
