name: Editor Clip Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct download URL of the source video'
        required: true
      creator_handle:
        description: 'Creator handle to credit'
        required: true
      original_link:
        description: 'Link to the original full video'
        required: true

jobs:
  make-and-schedule-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check for duplicate source video
        id: dedupe
        env:
          ORIGINAL_LINK: ${{ github.event.inputs.original_link }}
        run: python editor_dedupe_check.py

      - name: Download source video
        if: steps.dedupe.outputs.skip != 'true'
        timeout-minutes: 15
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: python editor_download.py
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}

      - name: Detect best moment and cut clip
        if: steps.dedupe.outputs.skip != 'true'
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python editor_detect_and_cut.py

      - name: Generate metadata
        if: steps.dedupe.outputs.skip != 'true'
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CREATOR_HANDLE: ${{ github.event.inputs.creator_handle }}
          ORIGINAL_LINK: ${{ github.event.inputs.original_link }}
        run: python editor_generate_metadata.py

      - name: Assemble clip with captions and watermark
        if: steps.dedupe.outputs.skip != 'true'
        timeout-minutes: 15
        run: python editor_assemble.py

      - name: Upload and schedule to EDITOR channel
        if: steps.dedupe.outputs.skip != 'true'
        timeout-minutes: 10
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: python editor_upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          EDITOR_YT_REFRESH_TOKEN: ${{ secrets.EDITOR_YT_REFRESH_TOKEN }}

      - name: Save history files back to repo
        if: always() && steps.dedupe.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add editor_seen_videos.json editor_hashtag_history.json 2>/dev/null || true
          git commit -m "Update editor history files" || echo "No changes to commit"
          git push

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-debug-${{ github.run_number }}
          path: output/
          retention-days: 5

      - name: Notify Discord (success)
        if: success() && steps.dedupe.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python editor_notify_discord.py success

      - name: Notify Discord (skipped duplicate)
        if: steps.dedupe.outputs.skip == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python editor_notify_discord.py duplicate

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python editor_notify_discord.py failure
