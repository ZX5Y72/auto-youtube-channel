name: Editor Clip Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct download URL of the source video'
        required: true
      creator_handle:
        description: 'Creator handle to credit'
        required: true
      original_link:
        description: 'Link to the original full video'
        required: true

jobs:
  make-and-schedule-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download source video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: python editor_download.py

      - name: Detect best moment and cut clip
        timeout-minutes: 20
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python editor_detect_and_cut.py

      - name: Generate metadata
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CREATOR_HANDLE: ${{ github.event.inputs.creator_handle }}
          ORIGINAL_LINK: ${{ github.event.inputs.original_link }}
        run: python editor_generate_metadata.py

      - name: Assemble clip with captions and watermark
        timeout-minutes: 15
        run: python editor_assemble.py

      - name: Upload and schedule to EDITOR channel
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          EDITOR_YT_REFRESH_TOKEN: ${{ secrets.EDITOR_YT_REFRESH_TOKEN }}
        run: python editor_upload.py

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python editor_notify_discord.py success

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python editor_notify_discord.py failure
